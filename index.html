    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AlexCipher">

    <style>
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --cyber-cyan: #22d3ee;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Splash Screen Premium */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }
        .loader-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(34, 211, 238, 0.1);
            border-top-color: var(--cyber-cyan);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        textarea, input { user-select: text !important; -webkit-user-select: text !important; }
    </style>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "crypto-js": "https://esm.sh/crypto-js@^4.2.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="text-slate-200 antialiased">
    <div id="splash-screen">
        <div class="loader-ring"></div>
        <div class="mt-6 text-xl font-black tracking-tighter text-white">Alex<span class="text-cyan-400">Cipher</span></div>
    </div>

    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <script>
      // Gestion du Splash Screen
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 500);
          }
        }, 800);
      });

      // Enregistrement du Service Worker (PWA)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('AlexCipher SW Registered:', registration.scope);
              
              // Détection des mises à jour
              registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // Dispatch un événement personnalisé pour l'UI React
                      window.dispatchEvent(new CustomEvent('pwa-update-available'));
                    }
                  };
                }
              };
            })
            .catch(error => console.debug('SW skip:', error));
        });

        // Rechargement intelligent lors de la mise à jour du contrôleur
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
