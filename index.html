<!DOCTYPE html>
<html lang="fr" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>AlexCipher - Sécurisez vos échanges</title>

    <meta name="google" content="notranslate">
    <meta name="theme-color" id="theme-color" content="#f8fafc">
    <meta name="description" content="AlexCipher - Cryptage AES-256 local. Votre vie privée est un droit, nous la protégeons.">

    <!-- PWA / iOS Integration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AlexCipher">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">

    <!-- Touch -->
    <meta name="handheld-friendly" content="true">

    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2092/2092663.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2092/2092663.png">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/index.css">

    <script>
      // Theme persistence - runs before page render to prevent flash
      (function() {
        const saved = localStorage.getItem('alexcipher_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
          document.getElementById('theme-color')?.setAttribute('content', '#0f172a');
        } else {
          document.getElementById('theme-color')?.setAttribute('content', '#f8fafc');
        }
      })();
    </script>
</head>
<body class="antialiased" style="background-color: var(--bg-primary); color: var(--text-primary); overscroll-behavior: none;">
    <div id="splash-screen">
        <div class="splash-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="splash-title" style="color: var(--text-primary);">Alex<span style="color: var(--accent);">Cipher</span></div>
        <div class="splash-loader"><div class="splash-loader-bar"></div></div>
        <div class="splash-tagline">Secure • Private • Local</div>
    </div>

    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <script>
      // Splash Screen
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash) splash.classList.add('hide');
        }, 1200);
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash) splash.remove();
        }, 2000);
      });

      // Update theme-color meta on theme change
      window.addEventListener('theme-change', (e) => {
        const meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', e.detail === 'dark' ? '#0f172a' : '#f8fafc');
      });

      // Service Worker (PWA)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('AlexCipher SW Registered:', registration.scope);
              registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      window.dispatchEvent(new CustomEvent('pwa-update-available'));
                    }
                  };
                }
              };
            })
            .catch(error => console.debug('SW skip:', error));
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
</body>
</html>
